<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindBridge — Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #070d16; --bg2: #0d1829; --bg3: #111f33;
      --border: #1b2a40; --text: #e2eaf4; --muted: #5a7090; --muted2: #8ba3bf;
      --green: #4ade80; --green-dim: rgba(74,222,128,0.12); --green-border: rgba(74,222,128,0.3);
      --blue: #38bdf8; --red: #f87171; --orange: #fb923c; --accent: #16a34a; --gold: #facc15; --purple: #a78bfa;
    }
    html, body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; font-size: 15px; }

    #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      background: radial-gradient(ellipse at 30% 20%, rgba(22,163,74,0.08) 0%, transparent 60%), var(--bg); }
    .login-card { width: 100%; max-width: 380px; background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 40px; }
    .login-logo { font-family: 'DM Serif Display', serif; font-size: 24px; color: var(--green); margin-bottom: 4px; }
    .login-sub { font-size: 12px; color: var(--muted); margin-bottom: 28px; letter-spacing: 1px; text-transform: uppercase; }
    .login-input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; margin-bottom: 12px; transition: border-color 0.2s; }
    .login-input:focus { border-color: var(--green); }
    .login-input::placeholder { color: var(--muted); }
    .login-btn { width: 100%; padding: 13px; background: var(--accent); color: white; border: none; border-radius: 12px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; }
    .login-error { font-size: 13px; color: var(--red); margin-top: 10px; display: none; text-align: center; }

    #admin-screen { display: none; }
    .topbar { position: sticky; top: 0; z-index: 100; background: rgba(7,13,22,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-logo { font-family: 'DM Serif Display', serif; font-size: 18px; color: var(--green); }
    .topbar-badge { font-size: 10px; background: var(--accent); color: white; padding: 2px 8px; border-radius: 20px; font-weight: 600; letter-spacing: 1px; }
    .topbar-right { display: flex; align-items: center; gap: 8px; }
    .topbar-btn { background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer; transition: all 0.2s; }
    .topbar-btn:hover { border-color: var(--green); color: var(--green); }
    .topbar-btn.danger:hover { border-color: var(--red); color: var(--red); }
    .main { max-width: 1100px; margin: 0 auto; padding: 28px 20px; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }
    .stat-icon { font-size: 22px; margin-bottom: 10px; }
    .stat-value { font-family: 'DM Serif Display', serif; font-size: 32px; color: var(--text); margin-bottom: 4px; }
    .stat-label { font-size: 12px; color: var(--muted); }
    .stat-card.highlight { border-color: var(--green-border); background: var(--green-dim); }
    .stat-card.highlight .stat-value { color: var(--green); }
    .stat-card.gold { border-color: rgba(250,204,21,0.3); background: rgba(250,204,21,0.08); }
    .stat-card.gold .stat-value { color: var(--gold); }
    .stat-card.purple { border-color: rgba(167,139,250,0.3); background: rgba(167,139,250,0.08); }
    .stat-card.purple .stat-value { color: var(--purple); }

    .section { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .section-title { font-family: monospace; font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
    .chart-wrap { position: relative; height: 180px; }

    .funnel { display: flex; flex-direction: column; gap: 10px; }
    .funnel-step { display: flex; align-items: center; gap: 12px; }
    .funnel-label { width: 190px; font-size: 12px; color: var(--text); flex-shrink: 0; }
    .funnel-bar-wrap { flex: 1; background: var(--bg3); border-radius: 20px; height: 22px; overflow: hidden; position: relative; }
    .funnel-bar { height: 100%; border-radius: 20px; transition: width 0.6s ease; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; min-width: 34px; }
    .funnel-bar span { font-size: 10px; font-weight: 600; color: #04120a; }
    .funnel-pct { width: 90px; text-align: right; font-size: 11px; color: var(--muted); flex-shrink: 0; }

    /* PIPELINE DE LEADS */
    .pipeline-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .pchip { display: flex; align-items: center; gap: 6px; border-radius: 20px; padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--bg3); color: var(--muted2); transition: all 0.15s; }
    .pchip:hover { transform: translateY(-1px); }
    .pchip.sel { outline: 2px solid rgba(255,255,255,0.25); }
    .pchip .n { font-family: 'DM Serif Display', serif; font-size: 15px; }
    .pchip.c-prospectado { border-color: rgba(139,163,191,0.4); color: var(--muted2); }
    .pchip.c-contatado { border-color: rgba(56,189,248,0.4); color: var(--blue); }
    .pchip.c-interessado { border-color: rgba(251,146,60,0.4); color: var(--orange); }
    .pchip.c-cadastrado { border-color: var(--green-border); color: var(--green); }
    .pchip.c-pagante { border-color: rgba(250,204,21,0.4); color: var(--gold); }
    .pchip.c-perdido { border-color: rgba(248,113,113,0.4); color: var(--red); }

    .filters-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
    .filter-select { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 7px 10px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 12px; outline: none; cursor: pointer; }
    .filter-select:focus { border-color: var(--green); }
    .filter-label { font-size: 11px; color: var(--muted); margin-right: 2px; }
    .filter-clear { background: transparent; border: 1px solid var(--border); border-radius: 10px; padding: 7px 12px; color: var(--muted); font-size: 12px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .filter-clear:hover { border-color: var(--red); color: var(--red); }

    .search-wrap { position: relative; }
    .search-input { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 7px 12px 7px 34px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; width: 200px; transition: border-color 0.2s; }
    .search-input:focus { border-color: var(--green); }
    .search-input::placeholder { color: var(--muted); }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }

    .btn-add { background: var(--accent); color: white; border: none; border-radius: 10px; padding: 8px 16px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-add:hover { opacity: 0.9; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th { text-align: left; padding: 10px 12px; font-size: 10px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--border); font-weight: 600; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; cursor: pointer; }
    tbody tr:hover { background: var(--bg3); }
    tbody tr:last-child { border-bottom: none; }
    tbody td { padding: 12px; color: var(--text); vertical-align: middle; }
    .psi-name { font-weight: 600; }
    .psi-email { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .badge { display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
    .badge-paying { background: rgba(250,204,21,0.15); color: var(--gold); border: 1px solid rgba(250,204,21,0.3); }
    .badge-free { background: rgba(90,112,144,0.15); color: var(--muted); border: 1px solid var(--border); }
    .badge-active { background: var(--green-dim); color: var(--green); border: 1px solid var(--green-border); }
    .badge-inactive { background: rgba(248,113,113,0.12); color: var(--red); border: 1px solid rgba(248,113,113,0.3); }
    .contact-warn { color: var(--orange); }
    .no-results { padding: 32px; text-align: center; color: var(--muted); font-size: 13px; }

    .status-select { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; outline: none; cursor: pointer; }
    .status-select.s-prospectado { color: var(--muted2); }
    .status-select.s-contatado { color: var(--blue); border-color: rgba(56,189,248,0.4); }
    .status-select.s-interessado { color: var(--orange); border-color: rgba(251,146,60,0.4); }
    .status-select.s-cadastrado { color: var(--green); border-color: var(--green-border); }
    .status-select.s-pagante { color: var(--gold); border-color: rgba(250,204,21,0.4); }
    .status-select.s-perdido { color: var(--red); border-color: rgba(248,113,113,0.4); }
    .wa-mini { background: rgba(37,211,102,0.15); border: 1px solid rgba(37,211,102,0.35); color: #25d366; border-radius: 8px; padding: 3px 8px; font-size: 11px; cursor: pointer; font-family: 'DM Sans', sans-serif; }

    /* MODAIS */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); z-index: 200; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
    .modal-overlay.open { display: flex; }
    .profile-modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 28px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; }
    .profile-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
    .profile-name { font-family: 'DM Serif Display', serif; font-size: 22px; }
    .profile-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .profile-close { background: transparent; border: 1px solid var(--border); border-radius: 8px; width: 30px; height: 30px; color: var(--muted); cursor: pointer; font-size: 14px; flex-shrink: 0; }
    .profile-close:hover { border-color: var(--red); color: var(--red); }
    .profile-block { background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
    .profile-block-title { font-family: monospace; font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
    .profile-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; }
    .profile-row .k { color: var(--muted); flex-shrink: 0; }
    .profile-row .v { color: var(--text); text-align: right; word-break: break-word; }
    .profile-select, .profile-input { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 12px; outline: none; }
    .profile-select { cursor: pointer; }
    .profile-select:focus, .profile-input:focus { border-color: var(--green); }
    .profile-input { width: 170px; }
    .profile-input::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.6; cursor: pointer; }
    .form-field { margin-bottom: 12px; }
    .form-field label { display: block; font-size: 11px; color: var(--muted2); margin-bottom: 5px; letter-spacing: 0.5px; }
    .form-field input, .form-field select, .form-field textarea { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; }
    .form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: var(--green); }
    .form-field textarea { resize: vertical; min-height: 60px; }
    .form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-wa { display: inline-flex; align-items: center; gap: 6px; background: #25d366; color: #04120a; border: none; border-radius: 8px; padding: 7px 12px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-wa:disabled { background: var(--bg2); color: var(--muted); border: 1px solid var(--border); cursor: not-allowed; }
    .btn-mini { background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; color: var(--muted2); font-family: 'DM Sans', sans-serif; font-size: 11px; cursor: pointer; }
    .btn-mini:hover { border-color: var(--green); color: var(--green); }
    .btn-save { width: 100%; padding: 11px; background: var(--accent); color: white; border: none; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px; }
    .btn-delete-lead { width: 100%; padding: 9px; background: transparent; border: 1px solid rgba(248,113,113,0.4); color: var(--red); border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer; margin-top: 8px; }
    .timeline { position: relative; padding-left: 18px; }
    .timeline::before { content: ''; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
    .tl-item { position: relative; padding: 5px 0 5px 8px; font-size: 13px; }
    .tl-item::before { content: ''; position: absolute; left: -18px; top: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--green); border: 2px solid var(--bg3); }
    .tl-item.pending::before { background: var(--border); }
    .tl-item .tl-date { color: var(--muted); font-size: 11px; font-family: monospace; }
    .tl-item.pending { color: var(--muted); }
    .notes-area { width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; resize: vertical; min-height: 70px; }
    .notes-area:focus { border-color: var(--green); }
    .notes-hint { font-size: 10px; color: var(--muted); margin-top: 6px; text-align: right; }
    .toggle-paying-btn { width: 100%; padding: 10px; border-radius: 10px; border: none; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 4px; }
    .toggle-paying-btn.make { background: var(--accent); color: white; }
    .toggle-paying-btn.unmake { background: transparent; border: 1px solid rgba(248,113,113,0.4); color: var(--red); }

    .loading { display: flex; align-items: center; justify-content: center; padding: 60px; color: var(--muted); gap: 10px; }
    .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin 0.7s linear infinite; }
    .last-updated { font-size: 11px; color: var(--muted); text-align: right; margin-bottom: 16px; }
    .results-count { font-size: 11px; color: var(--muted); margin-bottom: 10px; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🌿 MindBridge</div>
    <div class="login-sub">Painel Administrativo</div>
    <input class="login-input" type="password" id="admin-password" placeholder="Senha de acesso" onkeydown="if(event.key==='Enter')checkPassword()" />
    <button class="login-btn" onclick="checkPassword()">Entrar</button>
    <div class="login-error" id="login-error">Senha incorreta.</div>
  </div>
</div>

<div id="admin-screen">
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-logo">🌿 MindBridge</span>
      <span class="topbar-badge">ADMIN</span>
    </div>
    <div class="topbar-right">
      <button class="topbar-btn" onclick="loadData()">↻ Atualizar</button>
      <button class="topbar-btn danger" onclick="logout()">Sair</button>
    </div>
  </div>
  <div class="main">
    <div class="last-updated" id="last-updated"></div>
    <div id="content"><div class="loading"><div class="spinner"></div> Carregando dados...</div></div>
  </div>
</div>

<div class="modal-overlay" id="profile-overlay" onclick="if(event.target===this)closeProfile()">
  <div class="profile-modal" id="profile-modal"></div>
</div>

<div class="modal-overlay" id="lead-overlay" onclick="if(event.target===this)closeLead()">
  <div class="profile-modal" id="lead-modal"></div>
</div>

<script>
const { createClient } = supabase;
const sb = createClient('https://vuhxuzyovxfufakbrint.supabase.co','sb_publishable_BqnA-s8cqQrWNOSWFAOSnA_3qJyhVwi');

const ADMIN_PASSWORD = 'Samuel2609';
const LEAD_STATUSES = ['prospectado','contatado','interessado','cadastrado','pagante','perdido'];
const STATUS_LABELS = { prospectado:'Prospectado', contatado:'Contatado', interessado:'Interessado', cadastrado:'Cadastrado', pagante:'💰 Pagante', perdido:'Perdido' };

let activityChart = null;
let allPsychologists = [], allPatients = [], allRecords = [], allLeads = [];
let crmMap = {};
let currentProfileId = null;
let currentLeadId = null; // null = novo lead
let leadStatusFilter = '';
let notesTimer = null;

// ── CRM ──────────────────────────────────────────────────
function getCrm(id) {
  return crmMap[id] || { psychologist_id: id, paying: false, paying_since: null, payment_method: '', phone: '', notes: '', last_contact: null };
}
async function setCrm(id, patch) {
  const merged = { ...getCrm(id), ...patch, psychologist_id: id, updated_at: new Date().toISOString() };
  crmMap[id] = merged;
  const { error } = await sb.from('crm').upsert(merged, { onConflict: 'psychologist_id' });
  if (error) console.error('Erro ao salvar CRM:', error.message);
}
function countPaying() { return Object.values(crmMap).filter(c => c.paying).length; }

async function migrateLocalCrm() {
  if (localStorage.getItem('mb_crm_migrated')) return;
  const oldCrm = JSON.parse(localStorage.getItem('mb_crm') || '{}');
  const oldPaying = JSON.parse(localStorage.getItem('mb_paying') || '[]');
  const rows = [];
  Object.entries(oldCrm).forEach(([id, c]) => {
    if (!crmMap[id]) rows.push({ psychologist_id: Number(id), paying: !!c.paying, paying_since: c.payingSince || null, payment_method: c.paymentMethod || '', notes: c.notes || '', phone: '', last_contact: null });
  });
  oldPaying.forEach(id => {
    if (!crmMap[id] && !rows.find(r => r.psychologist_id === id)) rows.push({ psychologist_id: id, paying: true, paying_since: null, payment_method: '', notes: '', phone: '', last_contact: null });
  });
  if (rows.length > 0) {
    const { error } = await sb.from('leads').select('id').limit(0); // no-op sanity
    const up = await sb.from('crm').upsert(rows, { onConflict: 'psychologist_id' });
    if (!up.error) rows.forEach(r => { crmMap[r.psychologist_id] = r; });
  }
  localStorage.setItem('mb_crm_migrated', '1');
}

// ── Sincronização leads ↔ cadastros ──────────────────────
async function syncLeads() {
  const emailMap = {};
  allPsychologists.forEach(p => { if (p.email) emailMap[p.email.toLowerCase().trim()] = p; });
  for (const lead of allLeads) {
    let changed = {};
    // Lead sem vínculo mas com email que já virou cadastro → converte
    if (!lead.psychologist_id && lead.email) {
      const p = emailMap[lead.email.toLowerCase().trim()];
      if (p) {
        changed.psychologist_id = p.id;
        if (lead.status !== 'pagante' && lead.status !== 'perdido') changed.status = 'cadastrado';
      }
    }
    // Lead vinculado cujo cliente virou pagante → sobe status
    const linkedId = changed.psychologist_id || lead.psychologist_id;
    if (linkedId && getCrm(linkedId).paying && lead.status !== 'pagante') {
      changed.status = 'pagante';
    }
    if (Object.keys(changed).length > 0) {
      Object.assign(lead, changed);
      await sb.from('leads').update(changed).eq('id', lead.id);
    }
  }
}

// ── Auth ─────────────────────────────────────────────────
function checkPassword() {
  const pwd = document.getElementById('admin-password').value;
  if (pwd === ADMIN_PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    loadData();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}
function logout() {
  document.getElementById('admin-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('admin-password').value = '';
  document.getElementById('login-error').style.display = 'none';
}

// ── Dados ────────────────────────────────────────────────
async function loadData() {
  document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div> Carregando dados...</div>';
  const [psiRes, patRes, recRes, crmRes, leadRes] = await Promise.all([
    sb.from('psychologists').select('*').order('created_at', { ascending: false }),
    sb.from('patients').select('*').order('created_at', { ascending: false }),
    sb.from('records').select('*').order('created_at', { ascending: false }),
    sb.from('crm').select('*'),
    sb.from('leads').select('*').order('created_at', { ascending: false }),
  ]);
  allPsychologists = psiRes.data || [];
  allPatients = patRes.data || [];
  allRecords = recRes.data || [];
  allLeads = leadRes.data || [];
  crmMap = {};
  (crmRes.data || []).forEach(r => { crmMap[r.psychologist_id] = r; });
  if (crmRes.error) console.error('Tabela crm:', crmRes.error.message);
  if (leadRes.error) console.error('Tabela leads:', leadRes.error.message);
  await migrateLocalCrm();
  await syncLeads();
  document.getElementById('last-updated').textContent = 'Atualizado em ' + new Date().toLocaleString('pt-BR');
  renderContent();
}

// ── Helpers ──────────────────────────────────────────────
function psiPatients(psiId) { return allPatients.filter(p => p.psychologist_id === psiId); }
function psiRecords(psiId) {
  const ids = psiPatients(psiId).map(p => p.id);
  return allRecords.filter(r => ids.includes(r.patient_id));
}
function isActive7d(psiId) {
  const last7 = new Date(Date.now() - 7*24*60*60*1000);
  return psiRecords(psiId).some(r => new Date(r.created_at) >= last7);
}
function lastRecordDate(psiId) {
  const recs = psiRecords(psiId);
  return recs.length > 0 ? new Date(recs[0].created_at) : null;
}
function daysSince(dateStr) {
  if (!dateStr) return null;
  return Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
}
function waLink(phone) {
  const digits = (phone || '').replace(/\D/g, '');
  if (!digits) return null;
  const full = digits.length <= 11 ? '55' + digits : digits;
  return 'https://wa.me/' + full;
}
function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Pipeline chips ───────────────────────────────────────
function renderPipelineChips() {
  const el = document.getElementById('pipeline-chips');
  if (!el) return;
  el.innerHTML = LEAD_STATUSES.map(s => {
    const n = allLeads.filter(l => l.status === s).length;
    const sel = leadStatusFilter === s ? 'sel' : '';
    return `<div class="pchip c-${s} ${sel}" onclick="toggleLeadStatusFilter('${s}')"><span class="n">${n}</span> ${STATUS_LABELS[s]}</div>`;
  }).join('');
}

function toggleLeadStatusFilter(s) {
  leadStatusFilter = leadStatusFilter === s ? '' : s;
  renderPipelineChips();
  renderLeadTable();
}

// ── Tabela de leads ──────────────────────────────────────
function renderLeadTable() {
  const q = (document.getElementById('lead-search')?.value || '').trim().toLowerCase();
  const fSource = document.getElementById('lf-source')?.value || '';
  const fContact = document.getElementById('lf-contact')?.value || '';

  let list = [...allLeads];
  if (leadStatusFilter) list = list.filter(l => l.status === leadStatusFilter);
  if (q) list = list.filter(l =>
    (l.name || '').toLowerCase().includes(q) ||
    (l.email || '').toLowerCase().includes(q) ||
    (l.phone || '').includes(q) ||
    (l.specialty || '').toLowerCase().includes(q)
  );
  if (fSource) list = list.filter(l => l.source === fSource);
  if (fContact === 'never') list = list.filter(l => !l.last_contact);
  if (fContact === '3d') list = list.filter(l => { const d = daysSince(l.last_contact); return d === null || d >= 3; });
  if (fContact === '7d') list = list.filter(l => { const d = daysSince(l.last_contact); return d === null || d >= 7; });

  const countEl = document.getElementById('lead-count');
  if (countEl) countEl.textContent = list.length + ' lead' + (list.length !== 1 ? 's' : '');

  const tbody = document.getElementById('lead-table-body');
  if (!tbody) return;
  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="no-results">Nenhum lead. Clique em "+ Novo lead" para adicionar o primeiro.</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(l => {
    const wa = waLink(l.phone);
    const dContact = daysSince(l.last_contact);
    let contactCell = '—';
    if (l.last_contact) {
      contactCell = new Date(l.last_contact + 'T12:00:00').toLocaleDateString('pt-BR');
      if (dContact >= 7 && !['cadastrado','pagante','perdido'].includes(l.status)) contactCell = `<span class="contact-warn">${contactCell} (${dContact}d)</span>`;
    }
    return `<tr onclick="openLead(${l.id})">
      <td><div class="psi-name">${esc(l.name)}</div>${l.email ? `<div class="psi-email">${esc(l.email)}</div>` : ''}</td>
      <td>${wa ? `<button class="wa-mini" onclick="event.stopPropagation();window.open('${wa}','_blank')">💬 ${esc(l.phone)}</button>` : '—'}</td>
      <td style="font-size:12px;color:var(--muted2)">${esc(l.specialty) || '—'}</td>
      <td style="font-size:12px;color:var(--muted)">${esc(l.source) || '—'}</td>
      <td onclick="event.stopPropagation()">
        <select class="status-select s-${l.status}" onchange="quickStatus(${l.id}, this.value)">
          ${LEAD_STATUSES.map(s => `<option value="${s}" ${l.status === s ? 'selected' : ''}>${STATUS_LABELS[s]}</option>`).join('')}
        </select>
      </td>
      <td style="font-size:12px;color:var(--muted2)">${contactCell}</td>
    </tr>`;
  }).join('');
}

function clearLeadFilters() {
  const s = document.getElementById('lead-search'); if (s) s.value = '';
  ['lf-source','lf-contact'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  leadStatusFilter = '';
  renderPipelineChips();
  renderLeadTable();
}

async function quickStatus(leadId, status) {
  const lead = allLeads.find(l => l.id === leadId);
  if (!lead) return;
  lead.status = status;
  await sb.from('leads').update({ status }).eq('id', leadId);
  renderPipelineChips();
  renderLeadTable();
}

// ── Modal de lead (novo/editar) ──────────────────────────

  document.getElementById('lead-modal').innerHTML = `
    <div class="profile-header">
      <div>
        <div class="profile-name">${isNew ? 'Novo lead' : esc(l.name)}</div>
        <div class="profile-sub">${isNew ? 'Adicionar contato à prospecção' : 'Lead desde ' + new Date(l.created_at).toLocaleDateString('pt-BR')}</div>

    </div>

    ${linked ? `<div class="profile-block" style="border-color:var(--green-border)">
      <div class="profile-block-title" style="color:var(--green)">✓ Convertido em cliente</div>
      <div style="font-size:13px;color:var(--muted2);margin-bottom:8px">Este lead criou conta no painel como <strong style="color:var(--text)">${esc(linked.name)}</strong>.</div>

    <div class="form-2col">
      <div class="form-field"><label>WhatsApp</label><input id="ld-phone" type="tel" placeholder="(11) 99999-9999" value="${l ? esc(l.phone) : ''}" /></div>
      <div class="form-field"><label>E-mail</label><input id="ld-email" type="email" placeholder="email@exemplo.com" value="${l ? esc(l.email) : ''}" /></div>
    </div>
    <div class="form-2col">
      <div class="form-field"><label>Especialidade</label><input id="ld-specialty" type="text" placeholder="Ex: TCC, infantil, casal..." value="${l ? esc(l.specialty) : ''}" /></div>
      <div class="form-field"><label>Origem</label>
        <select id="ld-source">
          ${['Instagram','Google Maps','Indicação','LinkedIn','Outro'].map(s => `<option value="${s}" ${l && l.source === s ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="form-2col">
      <div class="form-field"><label>Status</label>
        <select id="ld-status">
          ${LEAD_STATUSES.map(s => `<option value="${s}" ${(l ? l.status : 'prospectado') === s ? 'selected' : ''}>${STATUS_LABELS[s]}</option>`).join('')}
        </select>
      </div>
      <div class="form-field"><label>Último contato</label><input id="ld-contact" type="date" value="${l && l.last_contact ? l.last_contact : ''}" /></div>
    </div>
    <div class="form-field"><label>Observações</label><textarea id="ld-notes" placeholder="Anotações sobre a conversa, interesse, objeções...">${l ? esc(l.notes) : ''}</textarea></div>

    <div style="display:flex;gap:8px;margin-top:4px">
      ${wa ? `<button class="btn-wa" onclick="window.open('${wa}','_blank')">💬 WhatsApp</button>` : ''}
      <button class="btn-mini" onclick="document.getElementById('ld-contact').value = new Date().toISOString().slice(0,10)">Contato hoje</button>
    </div>

    <button class="btn-save" onclick="saveLead()">${isNew ? 'Adicionar lead' : 'Salvar alterações'}</button>
    ${!isNew ? '<button class="btn-delete-lead" onclick="deleteLead()">Excluir lead</button>' : ''}
  `;
  document.getElementById('lead-overlay').classList.add('open');
}

function closeLead() {
  document.getElementById('lead-overlay').classList.remove('open');
  currentLeadId = null;
}

async function saveLead() {
  const name = document.getElementById('ld-name').value.trim();
  if (!name) { alert('O nome é obrigatório.'); return; }
  const row = {
    name,
    phone: document.getElementById('ld-phone').value.trim(),
    email: document.getElementById('ld-email').value.trim(),
    specialty: document.getElementById('ld-specialty').value.trim(),
    source: document.getElementById('ld-source').value,
    status: document.getElementById('ld-status').value,
    last_contact: document.getElementById('ld-contact').value || null,
    notes: document.getElementById('ld-notes').value,
    updated_at: new Date().toISOString(),
  };
  if (currentLeadId !== null) {
    const { error } = await sb.from('leads').update(row).eq('id', currentLeadId);
    if (error) { alert('Erro ao salvar: ' + error.message); return; }
    const lead = allLeads.find(l => l.id === currentLeadId);
    Object.assign(lead, row);
  } else {
    const { data, error } = await sb.from('leads').insert(row).select().single();
    if (error) { alert('Erro ao adicionar: ' + error.message); return; }
    allLeads.unshift(data);
  }
  closeLead();
  await syncLeads();
  renderPipelineChips();
  renderLeadTable();
  renderContent();
}

async function deleteLead() {
  if (currentLeadId === null) return;
  if (!confirm('Excluir este lead permanentemente?')) return;
  await sb.from('leads').delete().eq('id', currentLeadId);
  allLeads = allLeads.filter(l => l.id !== currentLeadId);
  closeLead();
  renderPipelineChips();
  renderLeadTable();
  renderContent();
}

// ── Filtros psicólogos ───────────────────────────────────
function applyFilters() {
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  const fStatus = document.getElementById('f-status')?.value || '';
  const fActivity = document.getElementById('f-activity')?.value || '';
  const fPatients = document.getElementById('f-patients')?.value || '';
  const fContact = document.getElementById('f-contact')?.value || '';
  const fSort = document.getElementById('f-sort')?.value || 'recent';

  let list = [...allPsychologists];

  if (q) list = list.filter(p => p.name.toLowerCase().includes(q) || p.email.toLowerCase().includes(q));
  if (fStatus === 'paying') list = list.filter(p => getCrm(p.id).paying);
  if (fStatus === 'beta') list = list.filter(p => !getCrm(p.id).paying);
  if (fActivity === 'active') list = list.filter(p => isActive7d(p.id));
  if (fActivity === 'inactive') list = list.filter(p => !isActive7d(p.id));
  if (fPatients === '0') list = list.filter(p => psiPatients(p.id).length === 0);
  if (fPatients === '1-4') list = list.filter(p => { const n = psiPatients(p.id).length; return n >= 1 && n <= 4; });
  if (fPatients === '5+') list = list.filter(p => psiPatients(p.id).length >= 5);
  if (fContact === 'never') list = list.filter(p => !getCrm(p.id).last_contact);
  if (fContact === '7d') list = list.filter(p => { const d = daysSince(getCrm(p.id).last_contact); return d === null || d >= 7; });

  if (fSort === 'recent') list.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  if (fSort === 'oldest') list.sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
  if (fSort === 'patients') list.sort((a,b) => psiPatients(b.id).length - psiPatients(a.id).length);
  if (fSort === 'records') list.sort((a,b) => psiRecords(b.id).length - psiRecords(a.id).length);

  const countEl = document.getElementById('results-count');
  if (countEl) countEl.textContent = list.length + ' resultado' + (list.length !== 1 ? 's' : '');

  const tbody = document.getElementById('psi-table-body');
  if (!tbody) return;
  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="no-results">Nenhum psicólogo encontrado com esses filtros.</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(p => {
    const pats = psiPatients(p.id);
    const recs = psiRecords(p.id);
    const active = isActive7d(p.id);
    const c = getCrm(p.id);
    const dContact = daysSince(c.last_contact);
    let contactCell = '—';
    if (c.last_contact) {
      contactCell = new Date(c.last_contact + 'T12:00:00').toLocaleDateString('pt-BR');
      if (dContact >= 7) contactCell = `<span class="contact-warn">${contactCell} (${dContact}d)</span>`;
    }
    return `<tr onclick="openProfile(${p.id})">
      <td><div class="psi-name">${esc(p.name)}</div><div class="psi-email">${esc(p.email)}</div></td>
      <td style="color:var(--muted);font-size:12px">${esc(p.crp) || '—'}</td>
      <td>${pats.length}</td>
      <td>${recs.length}</td>
      <td><span class="badge ${active ? 'badge-active' : 'badge-inactive'}">${active ? '✅ Ativo' : '⚠️ Inativo'}</span></td>
      <td><span class="badge ${c.paying ? 'badge-paying' : 'badge-free'}">${c.paying ? '💰 Pagante' : 'Beta'}</span></td>
      <td style="font-size:12px;color:var(--muted2)">${contactCell}</td>
      <td style="font-size:12px;color:var(--muted)">${new Date(p.created_at).toLocaleDateString('pt-BR')}</td>
    </tr>`;
  }).join('');
}

function clearFilters() {
  const s = document.getElementById('search-input'); if (s) s.value = '';
  ['f-status','f-activity','f-patients','f-contact'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  const sort = document.getElementById('f-sort'); if (sort) sort.value = 'recent';
  applyFilters();
}

// ── Perfil do psicólogo ──────────────────────────────────
function openProfile(psiId) {
  const p = allPsychologists.find(x => x.id === psiId);
  if (!p) return;
  currentProfileId = psiId;
  const pats = psiPatients(psiId);
  const recs = psiRecords(psiId);
  const c = getCrm(psiId);
  const active = isActive7d(psiId);
  const lastRec = lastRecordDate(psiId);

  const firstPatient = pats.length > 0 ? pats.reduce((a,b) => new Date(a.created_at) < new Date(b.created_at) ? a : b) : null;
  const firstRecord = recs.length > 0 ? recs[recs.length - 1] : null;

  const fmtD = d => new Date(d).toLocaleDateString('pt-BR');
  const tl = [];
  // Se veio de lead, mostra a origem na timeline
  const originLead = allLeads.find(l => l.psychologist_id === psiId);
  if (originLead) tl.push({ done: true, label: `Prospectado via ${originLead.source || 'origem desconhecida'}`, date: fmtD(originLead.created_at) });
  tl.push({ done: true, label: 'Cadastro na plataforma', date: fmtD(p.created_at) });
  if (firstPatient) tl.push({ done: true, label: 'Primeiro paciente criado', date: fmtD(firstPatient.created_at) });
  else tl.push({ done: false, label: 'Primeiro paciente criado', date: 'pendente' });
  if (firstRecord) tl.push({ done: true, label: 'Primeiro registro de paciente', date: fmtD(firstRecord.created_at) });
  else tl.push({ done: false, label: 'Primeiro registro de paciente', date: 'pendente' });
  if (c.paying) tl.push({ done: true, label: 'Virou pagante 💰', date: c.paying_since ? fmtD(c.paying_since) : 'data não registrada' });
  else tl.push({ done: false, label: 'Virou pagante', date: 'pendente' });

  const wa = waLink(c.phone);

  document.getElementById('profile-modal').innerHTML = `
    <div class="profile-header">
      <div>
        <div class="profile-name">${esc(p.name)}</div>
        <div class="profile-sub">Cliente desde ${fmtD(p.created_at)}</div>
      </div>
      <button class="profile-close" onclick="closeProfile()">✕</button>
    </div>

    <div class="profile-block">
      <div class="profile-block-title">📇 Cadastro</div>
      <div class="profile-row"><span class="k">Nome</span><span class="v">${esc(p.name)}</span></div>
      <div class="profile-row"><span class="k">E-mail</span><span class="v">${esc(p.email)}</span></div>
      <div class="profile-row"><span class="k">CRP</span><span class="v">${esc(p.crp) || '—'}</span></div>
      <div class="profile-row"><span class="k">Status</span><span class="v"><span class="badge ${c.paying ? 'badge-paying' : 'badge-free'}">${c.paying ? '💰 Pagante' : 'Beta'}</span></span></div>
      <div class="profile-row"><span class="k">Atividade</span><span class="v"><span class="badge ${active ? 'badge-active' : 'badge-inactive'}">${active ? '✅ Ativo (7d)' : '⚠️ Inativo'}</span></span></div>
    </div>

    <div class="profile-block">
      <div class="profile-block-title">📞 Contato</div>
      <div class="profile-row">
        <span class="k">Telefone (WhatsApp)</span>
        <span class="v"><input class="profile-input" type="tel" placeholder="(11) 99999-9999" value="${esc(c.phone)}" onchange="savePhone(this.value)" /></span>
      </div>
      <div class="profile-row">
        <span class="k">Último contato</span>
        <span class="v" style="display:flex;gap:6px;align-items:center;justify-content:flex-end">
          <input class="profile-input" type="date" value="${c.last_contact || ''}" onchange="saveLastContact(this.value)" style="width:140px" />
          <button class="btn-mini" onclick="markContactToday()">Hoje</button>
        </span>
      </div>
      <div style="margin-top:8px">
        <button class="btn-wa" ${wa ? `onclick="window.open('${wa}','_blank')"` : 'disabled'}>💬 Abrir WhatsApp</button>
      </div>
    </div>

    <div class="profile-block">
      <div class="profile-block-title">💳 Pagamento</div>
      <div class="profile-row">
        <span class="k">Forma de pagamento</span>
        <span class="v">
          <select class="profile-select" onchange="setPaymentMethod(this.value)">
            <option value="" ${!c.payment_method ? 'selected' : ''}>—</option>
            <option value="Pix" ${c.payment_method === 'Pix' ? 'selected' : ''}>Pix</option>
            <option value="Cartão" ${c.payment_method === 'Cartão' ? 'selected' : ''}>Cartão</option>
            <option value="Boleto" ${c.payment_method === 'Boleto' ? 'selected' : ''}>Boleto</option>
          </select>
        </span>
      </div>
      <button class="toggle-paying-btn ${c.paying ? 'unmake' : 'make'}" onclick="toggleProfilePaying()">
        ${c.paying ? 'Remover status de pagante' : '💰 Marcar como pagante'}
      </button>
    </div>

    <div class="profile-block">
      <div class="profile-block-title">📅 Linha do tempo</div>
      <div class="timeline">
        ${tl.map(t => `<div class="tl-item ${t.done ? '' : 'pending'}">${t.label}<div class="tl-date">${t.date}</div></div>`).join('')}
      </div>
    </div>

    <div class="profile-block">
      <div class="profile-block-title">📈 Uso</div>
      <div class="profile-row"><span class="k">Pacientes</span><span class="v">${pats.length}</span></div>
      <div class="profile-row"><span class="k">Registros totais</span><span class="v">${recs.length}</span></div>
      <div class="profile-row"><span class="k">Último registro</span><span class="v">${lastRec ? lastRec.toLocaleDateString('pt-BR') : '—'}</span></div>
    </div>

    <div class="profile-block">
      <div class="profile-block-title">📝 Observações</div>
      <textarea class="notes-area" id="profile-notes" placeholder="Anotações sobre este cliente (contatos, follow-ups, feedbacks)..." oninput="scheduleNotesSave()">${esc(c.notes)}</textarea>
      <div class="notes-hint" id="notes-hint">salvo automaticamente no Supabase</div>
    </div>
  `;
  document.getElementById('profile-overlay').classList.add('open');
}

function closeProfile() {
  document.getElementById('profile-overlay').classList.remove('open');
  currentProfileId = null;
  applyFilters();
}

function setPaymentMethod(method) {
  if (currentProfileId === null) return;
  setCrm(currentProfileId, { payment_method: method });
}

function savePhone(phone) {
  if (currentProfileId === null) return;
  setCrm(currentProfileId, { phone });
  openProfile(currentProfileId);
}

function saveLastContact(date) {
  if (currentProfileId === null) return;
  setCrm(currentProfileId, { last_contact: date || null });
}

function markContactToday() {
  if (currentProfileId === null) return;
  const today = new Date().toISOString().slice(0, 10);
  setCrm(currentProfileId, { last_contact: today });
  openProfile(currentProfileId);
}

async function toggleProfilePaying() {
  if (currentProfileId === null) return;
  const c = getCrm(currentProfileId);
  if (c.paying) {
    await setCrm(currentProfileId, { paying: false });
  } else {
    await setCrm(currentProfileId, { paying: true, paying_since: c.paying_since || new Date().toISOString() });
  }
  await syncLeads();
  openProfile(currentProfileId);
  const statEl = document.getElementById('stat-paying');
  if (statEl) statEl.textContent = countPaying();
  renderPipelineChips();
  renderLeadTable();
}

function scheduleNotesSave() {
  if (notesTimer) clearTimeout(notesTimer);
  const hint = document.getElementById('notes-hint');
  if (hint) hint.textContent = 'salvando...';
  notesTimer = setTimeout(() => {
    if (currentProfileId === null) return;
    const val = document.getElementById('profile-notes')?.value || '';
    setCrm(currentProfileId, { notes: val });
    if (hint) hint.textContent = '✓ salvo no Supabase';
  }, 600);
}
</script>
</body>
</html>
